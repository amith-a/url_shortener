services:
  postgres:
    image: postgres:17

    container_name: url-shortener-db

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - '5433:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

    container_name: redis

    restart: unless-stopped

    ports:
      - '6379:6379'

volumes:
  postgres_data:
