name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: 3001
      LOG_LEVEL: error

      DATABASE_HOST: localhost
      DATABASE_PORT: 5433
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/url_shortener_test

      DB_PROVIDER: postgres
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: url_shortener_test

      BETTER_AUTH_SECRET: test-secret-key-at-least-32-chars-long-for-testing
      BETTER_AUTH_URL: http://localhost:3001

      REDIS_URL: redis://localhost:6379/1
      REDIS_URL_TTL: 300

      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_SECONDS: 60
      URL_CLEANUP_INTERVAL_SECONDS: 60

      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:5173
      REQUEST_TIMEOUT_MS: 10000
      SHUTDOWN_TIMEOUT_MS: 10000

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: url_shortener
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d url_shortener"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ------------------------------------------------------------
      # Test environment
      # ------------------------------------------------------------

      - name: Create CI test environment
        run: |
          cat > .env.test <<'EOF'
          PORT=3001
          LOG_LEVEL=error
          NODE_ENV=test
          DATABASE_HOST=localhost
          DATABASE_PORT=5433
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=url_shortener_test
          DATABASE_URL=postgres://postgres:postgres@localhost:5433/url_shortener_test
          DB_PROVIDER=postgres
          MONGO_URI=mongodb://localhost:27017
          MONGO_DB_NAME=url_shortener_test
          BETTER_AUTH_SECRET=test-secret-key-at-least-32-chars-long-for-testing
          BETTER_AUTH_URL=http://localhost:3001
          REDIS_URL=redis://localhost:6379/1
          REDIS_URL_TTL=300
          RATE_LIMIT_MAX=100
          RATE_LIMIT_WINDOW_SECONDS=60
          URL_CLEANUP_INTERVAL_SECONDS=60
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173
          REQUEST_TIMEOUT_MS=10000
          SHUTDOWN_TIMEOUT_MS=10000
          EOF

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # ------------------------------------------------------------
      # Test database
      # ------------------------------------------------------------

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres -d url_shortener; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Create test database
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -p 5433 \
            -U postgres \
            -d url_shortener \
            -v ON_ERROR_STOP=1 \
            -tc "SELECT 1 FROM pg_database WHERE datname = 'url_shortener_test'" |
            grep -q 1 ||
          PGPASSWORD=postgres psql \
            -h localhost \
            -p 5433 \
            -U postgres \
            -d url_shortener \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE url_shortener_test"

      - name: Run test migrations
        run: npm run migrate:test

      - name: Integration tests
        run: npm run test:integration

      # ------------------------------------------------------------
      # Application build
      # ------------------------------------------------------------

      - name: Build TypeScript project
        run: npm run build

      # ------------------------------------------------------------
      # Production-like Compose environment
      #
      # Compose files expect .env.
      # This file is created only inside the CI runner and is never
      # committed to the repository.
      # ------------------------------------------------------------

      - name: Create CI production Compose environment
        run: |
          cat > .env <<'EOF'
          NODE_ENV=production
          PORT=3000
          LOG_LEVEL=error

          DATABASE_HOST=postgres
          DATABASE_PORT=5432
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=url_shortener
          DATABASE_URL=postgres://postgres:postgres@postgres:5432/url_shortener

          DB_PROVIDER=postgres
          MONGO_URI=mongodb://mongo:27017
          MONGO_DB_NAME=url_shortener

          BETTER_AUTH_SECRET=test-secret-key-at-least-32-chars-long-for-testing
          BETTER_AUTH_URL=http://localhost:3000

          REDIS_URL=redis://redis:6379/0
          REDIS_URL_TTL=300

          RATE_LIMIT_MAX=100
          RATE_LIMIT_WINDOW_SECONDS=60
          URL_CLEANUP_INTERVAL_SECONDS=60

          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:5173

          REQUEST_TIMEOUT_MS=10000
          SHUTDOWN_TIMEOUT_MS=10000
          EOF

      # ------------------------------------------------------------
      # Compose validation
      # ------------------------------------------------------------

      - name: Validate Development Compose
        run: docker compose -f compose.dev.yml config

      - name: Validate Test Compose
        run: docker compose -f compose.test.yml config

      - name: Validate Production Compose
        run: docker compose -f compose.prod.yml config

      # ------------------------------------------------------------
      # Docker images
      # ------------------------------------------------------------

      - name: Build Docker runtime target
        run: docker build --target runtime -t url-shortener-runtime:ci .

      - name: Build Docker migration target
        run: docker build --target migration -t url-shortener-migration:ci .

      # ------------------------------------------------------------
      # Production-like Compose runtime verification
      # ------------------------------------------------------------

      - name: Start production-like Compose environment
        run: docker compose -f compose.prod.yml up -d

      - name: Verify production-like services
        run: docker compose -f compose.prod.yml ps -a

      - name: Verify API health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:3000/health; then
              exit 0
            fi

            sleep 2
          done

          docker compose -f compose.prod.yml logs
          exit 1

      - name: Verify API readiness
        run: curl --fail http://localhost:3000/ready

      - name: Verify migration completed
        run: |
          status=$(docker compose -f compose.prod.yml ps -a -q migration | xargs docker inspect -f '{{.State.ExitCode}}')
          test "$status" = "0"

      # ------------------------------------------------------------
      # Cleanup
      # ------------------------------------------------------------

      - name: Stop production-like Compose environment
        if: always()
        run: docker compose -f compose.prod.yml down -v --remove-orphans || true